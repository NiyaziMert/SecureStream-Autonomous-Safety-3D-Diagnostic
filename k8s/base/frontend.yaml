apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: securestream
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: securestream
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        # REPLACE THIS with your GCR/Artifact Registry image path
        image: gcr.io/PROJECT_ID/securestream-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: frontend
