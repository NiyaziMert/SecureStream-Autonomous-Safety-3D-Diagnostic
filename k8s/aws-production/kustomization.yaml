apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base
  - aws-metering-irsa.yaml
  - aws-hpa.yaml

patches:
  - path: aws-ingress-patch.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: securestream-ingress

images:
  - name: securestream-backend
    newName: 138218764434.dkr.ecr.eu-north-1.amazonaws.com/securestream-backend
    newTag: latest
  - name: securestream-frontend
    newName: 138218764434.dkr.ecr.eu-north-1.amazonaws.com/securestream-frontend
    newTag: latest
