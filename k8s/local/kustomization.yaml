apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

# Local Overrides
patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: securestream-backend:local
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: securestream-frontend:local

  # Change Services to LoadBalancer for local access
  - target:
      kind: Service
      name: backend-service
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
  - target:
      kind: Service
      name: frontend-service
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer

# Remove Ingress for local (since we use LoadBalancer services)
# Or keep it if you have an ingress controller installed
# patchesStrategicMerge:
#   - delete-ingress.yaml
