apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

# Local Overrides
patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: securestream-backend:local
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: securestream-frontend:local
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Deployment
      name: simulator
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: securestream-simulator:local
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never

  # Change Services to LoadBalancer for local access
  - target:
      kind: Service
      name: backend-service
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
  - target:
      kind: Service
      name: frontend-service
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
      - op: replace
        path: /spec/ports/0/port
        value: 5173
  - target:
      kind: Ingress
      name: securestream-ingress
    patch: |-
      - op: add
        path: /spec/ingressClassName
        value: traefik
      - op: replace
        path: /metadata/annotations/kubernetes.io~1ingress.class
        value: traefik

# Remove Ingress for local (since we use LoadBalancer services)
# Or keep it if you have an ingress controller installed
# patchesStrategicMerge:
#   - delete-ingress.yaml
